# voxeled layout — COLUMNS: 24 8×32 flexible panels rolled into Ø 29 mm tubes, three end to end
# in a 1 m frosted diffuser → 8 columns of 768 px (960 mm), standing on the ground around a floor.
# Each instance's `pos` is where the column's base stands (the fixture's axis is +Y from y = 0).
# Press E to drag them around, or use ring: / array: for regular arrangements. One column is
# 2,304 channels = 5 Art-Net universes, so the universes step by 5 (40 in all: an 8-port node).

name: columns
units: mm
fixtures:
  column:
    type: tube
    params: { cols: 8, rows: 32, panels: 3, pitchMM: 10, seamMM: 10 }   # Ø (80+10)/π = 28.6 mm, 96 rings
    output: { protocol: artnet, byteOrder: grb }                          # host: <your node>; per-column universe below
instances:
  - { fixture: column, name: c0, pos: [0, 0, 0],         output: { universe: 0 } }
  - { fixture: column, name: c1, pos: [2200, 0, 600],    output: { universe: 5 } }
  - { fixture: column, name: c2, pos: [3100, 0, -1800],  output: { universe: 10 } }
  - { fixture: column, name: c3, pos: [900, 0, -2900],   output: { universe: 15 } }
  - { fixture: column, name: c4, pos: [-1700, 0, -2100], output: { universe: 20 } }
  - { fixture: column, name: c5, pos: [-2800, 0, 400],   output: { universe: 25 } }
  - { fixture: column, name: c6, pos: [-1300, 0, 2500],  output: { universe: 30 } }
  - { fixture: column, name: c7, pos: [1400, 0, 3000],   output: { universe: 35 } }
show:
  holdS: 5
  fadeS: 2.5
  scenes:
    - { name: planes rising (world),  pattern: planeSweep, params: { speedMM: 400, spacingMM: 1200, widthMM: 250 } }
    - { name: wipe across the floor,  pattern: worldWipe,  params: { axis: 0, space: world, speedMM: 1200, spacingMM: 3000, widthMM: 600 } }
    - { name: chase up each column,   pattern: ribbonChase, params: { loops: 2, speed: 0.2 } }
