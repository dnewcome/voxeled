<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>voxeled — viewer</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #dfe6f3; }
  canvas { display: block; }
  #hud { position: fixed; top: 12px; left: 12px; z-index: 10;
    background: rgba(10,14,24,0.82); backdrop-filter: blur(8px);
    border: 1px solid rgba(120,150,210,0.22); border-radius: 12px;
    padding: 12px 15px; width: 250px; font-size: 12.5px; line-height: 1.55;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
  #hud h1 { font-size: 12px; margin: 0 0 8px; letter-spacing: .4px; color: #ff5e87;
    font-weight: 700; text-transform: uppercase; }
  #hud .row { display: flex; justify-content: space-between; gap: 10px; }
  #hud .row span:first-child { color: #8da0c2; }
  #hud .row span:last-child { color: #eef3ff; font-variant-numeric: tabular-nums; }
  #hud .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#ffcf4d; margin-right:6px; }
  #hud .dot.live { background:#69e08f; }
  #hud hr { border: none; border-top: 1px solid rgba(120,150,210,0.16); margin: 10px 0 8px; }
  #xf .lbl { display:flex; justify-content:space-between; gap:8px; font-size:11px; margin-bottom:5px; }
  #xf .lbl b { color:#eef3ff; font-weight:600; }
  #xf .lbl .a { color:#ff8fb0; } #xf .lbl .b { color:#8fd0ff; }
  #xf input[type=range] { width:100%; accent-color:#ff5e87; margin:2px 0 8px; }
  #xf button { width:100%; cursor:pointer; font-size:11.5px; color:#dfe6f3;
    background:rgba(120,150,210,0.14); border:1px solid rgba(120,150,210,0.3);
    border-radius:8px; padding:5px 8px; }
  #xf button.on { background:#ff5e87; border-color:#ff5e87; color:#1a0410; font-weight:700; }
  #help { position: fixed; bottom: 10px; left: 12px; z-index: 10; color: #56688a; font-size: 11px; }
  #h-mode.sim { color: #ffcf4d; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.js"
} }
</script>
</head>
<body>
<div id="hud">
  <h1>♥ voxeled viewer</h1>
  <div class="row"><span>Scene</span><span id="h-name">—</span></div>
  <div class="row"><span>Instances</span><span id="h-inst">—</span></div>
  <div class="row"><span>Pixels</span><span id="h-count">—</span></div>
  <div class="row"><span>Mode</span><span id="h-mode">dots</span></div>
  <div class="row"><span>Model</span><span id="h-model">—</span></div>
  <div class="row"><span>Bus</span><span id="h-bus"><span class="dot" id="h-dot"></span>waiting…</span></div>
  <div class="row"><span>Frames/s</span><span id="h-fps">—</span></div>
  <hr/>
  <div id="xf">
    <div class="lbl"><span class="a">◂ <b id="xf-a">A</b></span><span class="b"><b id="xf-b">B</b> ▸</span></div>
    <input id="xf-slider" type="range" min="0" max="1" step="0.005" value="0" />
    <button id="xf-auto" class="on">⟳ Auto-crossfade</button>
  </div>
</div>
<div id="help">drag orbit · scroll zoom · <b>S</b> sim · <b>B</b> bloom · <b>M</b> model · <b>N</b> normals · <b>[</b> <b>]</b> crossfade · <b>A</b> auto</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "./vendor/OrbitControls.js";
import { EffectComposer } from "./vendor/postprocessing/EffectComposer.js";
import { RenderPass } from "./vendor/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "./vendor/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "./vendor/postprocessing/OutputPass.js";
import { STLLoader } from "./vendor/loaders/STLLoader.js";
import { OBJLoader } from "./vendor/loaders/OBJLoader.js";
import { GLTFLoader } from "./vendor/loaders/GLTFLoader.js";

const $ = (id) => document.getElementById(id);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; // sim mode is HDR-ish (emissive > 1) + bloom
document.body.appendChild(renderer.domElement);

const scene3 = new THREE.Scene();
scene3.background = new THREE.Color(0x05060a);
// Lights only matter for structure meshes (LED dots are unlit; the simulator has its own shading).
scene3.add(new THREE.AmbientLight(0x8090b0, 0.9));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
keyLight.position.set(0.6, 1, 0.8);
scene3.add(keyLight);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 500000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

let composer = null, bloomPass = null;
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer?.setSize(innerWidth, innerHeight);
});

let mesh = null, simMesh = null, normalsLines = null, N = 0;

// ── structures: the sculpture's own CAD (STL/GLB/OBJ) drawn around the LEDs ──────────
// Dots mode: translucent context. Sim mode: an opaque, depth-writing body — a real occluder, so
// the steel hides the LEDs behind it just like the piece does. Toggle with M.
const structures = [];
let structuresOn = true;
const D2R = Math.PI / 180;
async function loadStructures(scene) {
  const list = scene.meta?.structures || [];
  const stl = new STLLoader(), obj = new OBJLoader(), gltf = new GLTFLoader();
  await Promise.all(list.map(async (s) => {
    try {
      const res = await fetch(s.url);
      if (!res.ok) throw new Error(`${res.status} ${s.url}`);
      let object;
      if (s.format === "stl") { const g = stl.parse(await res.arrayBuffer()); g.computeVertexNormals(); object = new THREE.Mesh(g); }
      else if (s.format === "obj") object = obj.parse(await res.text());
      else { const buf = await res.arrayBuffer(); object = await new Promise((ok, err) => gltf.parse(buf, "", (g) => ok(g.scene), err)); }
      const mats = {
        dots: new THREE.MeshStandardMaterial({ color: new THREE.Color(s.color), transparent: true, opacity: s.opacity, depthWrite: false, side: THREE.DoubleSide, roughness: 0.8, metalness: 0.2 }),
        sim: new THREE.MeshStandardMaterial({ color: 0x171a24, roughness: 0.85, metalness: 0.15, side: THREE.DoubleSide }),
      };
      const meshes = [];
      object.traverse((o) => { if (o.isMesh) { o.material = mats.dots; meshes.push(o); } });
      const inner = new THREE.Group();          // the file's own placement: scale (units → mm), rotate, translate
      inner.add(object);
      inner.scale.setScalar(s.scaleToMM);
      inner.rotation.set(s.rotDeg[0] * D2R, s.rotDeg[1] * D2R, s.rotDeg[2] * D2R, "ZYX"); // = voxeled's Z·Y·X Euler
      inner.position.set(s.pos[0], s.pos[1], s.pos[2]);
      const outer = new THREE.Group();          // the instance it rides with (per-fixture structures)
      outer.add(inner);
      if (s.parent) {
        outer.rotation.set(s.parent.rotDeg[0] * D2R, s.parent.rotDeg[1] * D2R, s.parent.rotDeg[2] * D2R, "ZYX");
        outer.position.set(s.parent.pos[0], s.parent.pos[1], s.parent.pos[2]);
      }
      scene3.add(outer);
      structures.push({ group: outer, meshes, mats, name: s.name });
    } catch (e) { console.warn("VOXELED_STRUCTURE_FAILED", s.name, e); }
  }));
  console.log("VOXELED_STRUCTURES_READY", structures.length, "of", list.length);
  $("h-model").textContent = list.length ? `${structures.length}/${list.length}` : "—";
  applyMode();
}
// ?sim=1 boots straight into the simulator (also how the headless render gate exercises it).
let simOn = new URLSearchParams(location.search).get("sim") === "1";
let bloomOn = true;
// Dim idle colour so the heart's shape is faintly visible even before any frame arrives —
// lets you tell "geometry didn't load" apart from "no frames on the bus".
const OFF = new THREE.Color(0x1a2138);
// Sim idle: every emitter ON at a neutral level, so the physics (lobe, dark backside, occlusion,
// bloom) reads on a fresh load / headless screenshot before any show frames arrive.
const SIM_IDLE = new THREE.Color(0.55, 0.52, 0.48);

// ── the simulator: each LED as an oriented, opaque emissive body ─────────────────
// One shader covers laser → spot → bare LED → diffused strip → rope, driven by the fixture's
// emitter profile (scene.meta.instances[k].emitter):
//   viewingAngleDeg  datasheet full angle at 50% intensity → lobe exponent p = ln½ / ln cos(θ/2)
//                    (120° ⇒ p = 1, exactly Lambertian; 10° ⇒ ~100, a spot; 170° ⇒ ~0.28, a rope)
//   sizeFrac         emitter body edge as a fraction of pixel pitch (1.0 = contiguous panel tiles)
//   coreFrac         lit fraction of the body (the chip/lens);  softness  edge diffusion of that core
//   gain / glow      emissive intensity / bloom contribution
// The body is a quad facing the emission normal. Its FRONT emits color × lobe(view angle) × core
// shape; its BACK is dark backing (the "backside shadow") — and both write depth, so the bodies
// occlude each other. For a panel ribbon the quads literally are the ribbon, dark on the back.
const EMIT_DEFAULT = { viewingAngleDeg: 120, sizeFrac: 0.9, coreFrac: 0.5, softness: 0.4, gain: 1.6, glow: 1.0 };
const lobeP = (deg) => {
  const c = Math.cos((Math.min(179.5, Math.max(0.5, deg)) * Math.PI) / 360);
  return Math.log(0.5) / Math.log(Math.max(1e-9, c));
};

const SIM_VERT = /* glsl */`
  attribute vec4 aEmit;                  // lobeP, coreFrac, softness, gain (per instance)
  varying vec3 vWorldPos, vWorldN, vColor;
  varying vec2 vUv;
  varying vec4 vEmit;
  void main() {
    vUv = uv; vEmit = aEmit;
    #ifdef USE_INSTANCING_COLOR
      vColor = instanceColor;
    #else
      vColor = vec3(1.0);
    #endif
    mat4 im = modelMatrix * instanceMatrix;
    vec4 wp = im * vec4(position, 1.0);
    vWorldPos = wp.xyz;
    vWorldN = normalize(mat3(im) * vec3(0.0, 0.0, 1.0));   // the quad's +Z is the emission normal
    gl_Position = projectionMatrix * viewMatrix * wp;
  }`;
const SIM_FRAG = /* glsl */`
  precision highp float;
  varying vec3 vWorldPos, vWorldN, vColor;
  varying vec2 vUv;
  varying vec4 vEmit;
  uniform vec3 uBacking;
  uniform float uExposure;
  void main() {
    vec3 V = normalize(cameraPosition - vWorldPos);
    float cosT = dot(vWorldN, V);
    // Backside of the emitter: the dark shadow (panel backing / chip substrate). Still opaque.
    if (cosT <= 0.0) { gl_FragColor = vec4(uBacking, 1.0); return; }
    float lobe = pow(cosT, vEmit.x);                 // viewing-angle response
    // the lit core (chip/lens) within the body, edge-diffused; the rest of the body is backing
    float d = length(vUv - 0.5) * 2.0;               // 0 at centre .. 1 at the inscribed body edge
    float core = vEmit.y, soft = max(vEmit.z, 0.02);
    float shape = 1.0 - smoothstep(core * (1.0 - soft), core * (1.0 + soft), d);
    vec3 lit = vColor * lobe * shape * vEmit.w * uExposure;
    gl_FragColor = vec4(uBacking + lit, 1.0);
  }`;

async function boot() {
  const scene = await (await fetch("scene.json")).json();
  const px = scene.pixels;
  N = px.length;
  $("h-name").textContent = scene.name;
  $("h-count").textContent = N.toLocaleString();
  $("h-inst").textContent = scene.meta?.instances?.length ?? 1;
  const show = scene.meta?.show;
  if (show?.scenes?.length >= 2) { $("xf-a").textContent = show.scenes[0]; $("xf-b").textContent = show.scenes[1]; }
  if (show?.single) document.getElementById("xf").style.opacity = 0.35;

  // Bounds → LED size + camera framing.
  const lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
  for (const p of px) for (let k = 0; k < 3; k++) { lo[k] = Math.min(lo[k], p.p[k]); hi[k] = Math.max(hi[k], p.p[k]); }
  const size = [hi[0]-lo[0], hi[1]-lo[1], hi[2]-lo[2]];
  const center = new THREE.Vector3((lo[0]+hi[0])/2, (lo[1]+hi[1])/2, (lo[2]+hi[2])/2);
  const diag = Math.hypot(...size);
  // Size each LED box off the real pixel PITCH (mm spacing), not the rig extent — otherwise
  // adding/spacing instances inflates the boxes and they overlap. ~0.5·pitch reads as distinct
  // dots with a gap. Fall back to a small fraction of the scene only if pitch is unknown.
  const pitch = scene.meta?.pitchMM;
  const ledSize = pitch ? pitch * 0.5 : diag / 400;

  // ── dots mode: plain boxes (the map) ──
  const geo = new THREE.BoxGeometry(ledSize, ledSize, ledSize);
  const mat = new THREE.MeshBasicMaterial({ toneMapped: false });
  mesh = new THREE.InstancedMesh(geo, mat, N);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < N; i++) {
    dummy.position.set(px[i].p[0], px[i].p[1], px[i].p[2]);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
    mesh.setColorAt(i, OFF);
  }
  mesh.instanceMatrix.needsUpdate = true;
  mesh.instanceColor.needsUpdate = true;
  scene3.add(mesh);

  // ── sim mode: oriented emissive bodies with a per-fixture emitter profile ──
  const emitters = (scene.meta?.instances || []).map((it) => ({ ...EMIT_DEFAULT, ...(it.emitter || {}) }));
  const emitOf = (i) => emitters[px[i].inst || 0] || EMIT_DEFAULT;
  const bodyBase = pitch ? pitch : (diag / 400) * 2;
  const simGeo = new THREE.PlaneGeometry(1, 1);
  const aEmit = new Float32Array(N * 4);
  const simMat = new THREE.ShaderMaterial({
    vertexShader: SIM_VERT, fragmentShader: SIM_FRAG,
    uniforms: { uBacking: { value: new THREE.Color(0x0a0c14) }, uExposure: { value: 1.0 } },
    side: THREE.DoubleSide,
  });
  simMesh = new THREE.InstancedMesh(simGeo, simMat, N);
  const q = new THREE.Quaternion(), zAxis = new THREE.Vector3(0, 0, 1), nv = new THREE.Vector3();
  const body = new THREE.Object3D();
  let maxGlow = 0;
  for (let i = 0; i < N; i++) {
    const e = emitOf(i), p = px[i].p, n = px[i].n;
    nv.set(n[0], n[1], n[2]).normalize();
    q.setFromUnitVectors(zAxis, nv);                   // local +Z → the emission normal
    const s = bodyBase * e.sizeFrac;
    body.position.set(p[0], p[1], p[2]); body.quaternion.copy(q); body.scale.set(s, s, 1);
    body.updateMatrix();
    simMesh.setMatrixAt(i, body.matrix);
    simMesh.setColorAt(i, SIM_IDLE);
    aEmit.set([lobeP(e.viewingAngleDeg), e.coreFrac, e.softness, e.gain], i * 4);
    maxGlow = Math.max(maxGlow, e.glow);
  }
  simGeo.setAttribute("aEmit", new THREE.InstancedBufferAttribute(aEmit, 4));
  simMesh.instanceMatrix.needsUpdate = true;
  simMesh.instanceColor.needsUpdate = true;
  simMesh.frustumCulled = false;
  scene3.add(simMesh);

  // bloom = the diffusion glow; strength tracks the strongest emitter's `glow`
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene3, camera));
  bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.9 * (maxGlow || 1), 0.45, 0.35);
  bloomPass.enabled = bloomOn;
  composer.addPass(bloomPass);
  composer.addPass(new OutputPass());
  applyMode();

  // Normal quills (toggle with N) — the visual proof the emission directions are right.
  const nGeo = new THREE.BufferGeometry();
  const pos = new Float32Array(N * 6);
  const qlen = ledSize * 3;
  for (let i = 0; i < N; i++) {
    const p = px[i].p, n = px[i].n;
    pos.set([p[0], p[1], p[2], p[0]+n[0]*qlen, p[1]+n[1]*qlen, p[2]+n[2]*qlen], i * 6);
  }
  nGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  normalsLines = new THREE.LineSegments(nGeo, new THREE.LineBasicMaterial({ color: 0x3a6ea5, transparent: true, opacity: 0.5 }));
  normalsLines.visible = false;
  scene3.add(normalsLines);

  // Ground grid at the scene's floor (min Y) so the pieces read as standing on the ground plane.
  const gspan = Math.max(hi[0] - lo[0], hi[2] - lo[2]) * 1.6;
  const gdiv = Math.max(6, Math.min(40, Math.round(gspan / 500)));
  const ground = new THREE.GridHelper(gspan, gdiv, 0x33436b, 0x172036);
  ground.position.set(center.x, lo[1], center.z);
  scene3.add(ground);

  // Default vantage: look from where the light GOES. Stand along the mean emission direction — the
  // audience side of the lit faces (for a Möbius ribbon, its dominant side) — elevated 3/4 so the
  // ground plane and depth read. Falls back to +Z for omni/balanced rigs. (The simulator made this
  // matter: the old fixed +Z camera was looking at the heart's dark backside.)
  const nbar = [0, 0, 0];
  for (const p of px) { nbar[0] += p.n[0]; nbar[1] += p.n[1]; nbar[2] += p.n[2]; }
  const horiz = Math.hypot(nbar[0], nbar[2]) > 0.05 * N ? [nbar[0], nbar[2]] : [0, 1]; // horizontal component, off the poles
  const hl = Math.hypot(horiz[0], horiz[1]);
  camera.up.set(0, 1, 0);
  camera.position.set(center.x + (horiz[0] / hl) * diag * 1.15, center.y + diag * 0.4, center.z + (horiz[1] / hl) * diag * 1.15);
  controls.target.copy(center);
  controls.update();

  // Reproducible vantages for screenshots / the render gate: ?az=<deg>&el=<deg> orbits the camera
  // around the scene centre (az 0 = in front, 90 = from +X); ?normals=1 shows the quills.
  const qs = new URLSearchParams(location.search);
  if (qs.has("az") || qs.has("el")) {
    const az = ((+qs.get("az") || 0) * Math.PI) / 180, el = ((+(qs.get("el") ?? 15)) * Math.PI) / 180, r = diag * 1.2;
    camera.position.set(center.x + r * Math.cos(el) * Math.sin(az), center.y + r * Math.sin(el), center.z + r * Math.cos(el) * Math.cos(az));
    controls.update();
  }
  if (qs.get("normals") === "1") normalsLines.visible = true;

  connectBus();
  console.log("VOXELED_READY", N); // headless render gate looks for this
  console.log("VOXELED_SIM_READY", emitters.length, "emitter profile(s)"); // …and for the simulator
  loadStructures(scene); // async; logs VOXELED_STRUCTURES_READY when the CAD is in
}

function applyMode() {
  if (mesh) mesh.visible = !simOn;
  if (simMesh) simMesh.visible = simOn;
  for (const st of structures) { st.group.visible = structuresOn; for (const m of st.meshes) m.material = simOn ? st.mats.sim : st.mats.dots; }
  const el = $("h-mode");
  el.textContent = simOn ? (bloomOn ? "sim + bloom" : "sim") : "dots";
  el.classList.toggle("sim", simOn);
  if (bloomPass) bloomPass.enabled = bloomOn;
}

// ── the normalized pixel bus ──────────────────────────────────────────────────
const tmp = new THREE.Color();
let frameCount = 0, lastFpsT = performance.now();

function connectBus() {
  const ws = new WebSocket(`ws://${location.host}/bus`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { $("h-dot").classList.add("live"); $("h-bus").lastChild.textContent = "live"; };
  ws.onclose = () => { $("h-dot").classList.remove("live"); $("h-bus").lastChild.textContent = "closed"; setTimeout(connectBus, 1000); };
  ws.onmessage = (ev) => {
    if (!mesh) return;
    const d = new Uint8Array(ev.data);
    const n = Math.min(N, (d.length / 3) | 0);
    for (let i = 0; i < n; i++) {
      tmp.setRGB(d[i*3]/255, d[i*3+1]/255, d[i*3+2]/255);
      mesh.setColorAt(i, tmp);
      simMesh?.setColorAt(i, tmp);
    }
    mesh.instanceColor.needsUpdate = true;
    if (simMesh) simMesh.instanceColor.needsUpdate = true;
    frameCount++;
  };
}

// ── crossfade control → hub /control ─────────────────────────────────────────
const slider = $("xf-slider"), autoBtn = $("xf-auto");
let lastSend = 0, pendingT = null;
function sendControl(qs) {
  const now = performance.now();
  if (now - lastSend < 60) { clearTimeout(pendingT); pendingT = setTimeout(() => sendControl(qs), 60); return; }
  lastSend = now;
  fetch("/control?" + qs).catch(() => {});
}
function goManual() {
  autoBtn.classList.remove("on");
  sendControl(`mode=manual&a=0&b=1&fader=${slider.value}`);
}
slider.addEventListener("input", goManual);
autoBtn.addEventListener("click", () => {
  const on = !autoBtn.classList.contains("on");
  autoBtn.classList.toggle("on", on);
  if (on) sendControl("mode=auto"); else goManual();
});

addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "n" && normalsLines) normalsLines.visible = !normalsLines.visible;
  else if (k === "s") { simOn = !simOn; applyMode(); }
  else if (k === "b") { bloomOn = !bloomOn; applyMode(); }
  else if (k === "m") { structuresOn = !structuresOn; applyMode(); }
  else if (k === "[") { slider.value = Math.max(0, +slider.value - 0.05); goManual(); }
  else if (k === "]") { slider.value = Math.min(1, +slider.value + 0.05); goManual(); }
  else if (k === "a") autoBtn.click();
});

function loop() {
  requestAnimationFrame(loop);
  controls.update();
  const now = performance.now();
  if (now - lastFpsT > 500) {
    $("h-fps").textContent = Math.round((frameCount * 1000) / (now - lastFpsT));
    frameCount = 0; lastFpsT = now;
  }
  if (simOn && composer) composer.render(); else renderer.render(scene3, camera);
}
loop();
boot().catch((e) => { $("h-name").textContent = "load error"; console.error("VOXELED_ERROR", e); });
</script>
</body>
</html>
